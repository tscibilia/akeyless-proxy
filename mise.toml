[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }

_.file = ["{{config_root}}/.secrets.env"]
ROOT_DIR = "{{config_root}}"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
gum = "0.17.0"
lefthook = "2.1.10"
jq = "1.8.2"
oxfmt = "0.63.0"
python = "3.14.7"
shellcheck = "0.11.0"
uv = "0.12.5"
yq = "4.53.3"
zizmor = "1.29.0"
